<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
  connect-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
  style-src * 'unsafe-inline';
  script-src * 'unsafe-inline' 'unsafe-eval';
  font-src * data:;
  img-src * data: blob:;
">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Calendar — Retiro CERRITO CAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#ffffff;--surface2:#f5f6f8;--surface3:#eceef2;--glass:rgba(255,255,255,0.72);
  --border:rgba(0,0,0,0.07);--border-s:rgba(0,0,0,0.13);--border-m:rgba(0,0,0,0.20);
  --text:#0f1117;--text2:#4a5568;--text3:#8a95a3;--text-inv:#ffffff;
  --accent:#0d9488;--accent-2:#0f766e;--accent-l:#ccfbf1;--accent-mid:rgba(13,148,136,0.12);
  --c-current:#166534;--cl-current:#dcfce7;--c-new:#9a3412;--cl-new:#ffedd5;
  --c-future:#3730a3;--cl-future:#e0e7ff;--c-service:#92400e;--cl-service:#fef3c7;
  --c-error:#b91c1c;--cl-error:#fee2e2;--c-booked:#1e40af;--cl-booked:#dbeafe;
  --col-label:216px;--col-maint:152px;--day-w:28px;--cell-h:58px;--header-h:46px;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.10);--shadow-lg:0 12px 40px rgba(0,0,0,.14);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d0f14;--surface:#161920;--surface2:#1e2230;--surface3:#252a38;--glass:rgba(22,25,32,0.80);
  --border:rgba(255,255,255,0.06);--border-s:rgba(255,255,255,0.11);--border-m:rgba(255,255,255,0.18);
  --text:#e8eaf0;--text2:#8892a4;--text3:#4e5a6e;--text-inv:#0d0f14;
  --accent:#14b8a6;--accent-2:#0d9488;--accent-l:rgba(20,184,166,0.15);--accent-mid:rgba(20,184,166,0.10);
  --c-current:#4ade80;--cl-current:rgba(74,222,128,0.12);--c-new:#fb923c;--cl-new:rgba(251,146,60,0.12);
  --c-future:#818cf8;--cl-future:rgba(129,140,248,0.12);--c-service:#fbbf24;--cl-service:rgba(251,191,36,0.12);
  --c-error:#f87171;--cl-error:rgba(248,113,113,0.12);--c-booked:#60a5fa;--cl-booked:rgba(96,165,250,0.12);
}}
body{font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;background:var(--bg);color:var(--text);min-height:100vh}
code,kbd,.mono{font-family:'JetBrains Mono',monospace}
.topbar{background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-s);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center}
.brand-logo i{color:#fff;font-size:14px}
.brand-name{font-size:13px;font-weight:600;color:var(--text)}
.brand-sep{width:1px;height:16px;background:var(--border-s)}
.brand-sub{font-size:11px;color:var(--text3)}
.tr{display:flex;align-items:center;gap:8px}
.datebadge{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.filebtn{font-size:11px;font-weight:500;color:var(--text2);background:var(--surface2);border:1px solid var(--border-s);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif}
.filebtn:hover{background:var(--surface3);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border-s)}
.sc{background:var(--surface);padding:14px 20px;position:relative}
.sl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;margin-bottom:5px}
.sv{font-size:24px;font-weight:700;line-height:1;color:var(--text)}
.ss{font-size:10px;color:var(--text3);margin-top:4px}
.main{padding:22px 24px 56px}
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mtitle{font-size:16px;font-weight:600;min-width:138px;color:var(--text)}
.nbtn{width:28px;height:28px;border:1px solid var(--border-s);border-radius:var(--radius-sm);background:var(--surface);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nbtn:hover{background:var(--surface2);color:var(--text)}
.tbtn{width:auto;padding:0 10px;color:var(--accent);border-color:var(--accent-l);background:var(--accent-mid)}
.calwrap{background:var(--surface);border:1px solid var(--border-s);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-md)}
.calscroll{overflow-x:auto}
.caltable{border-collapse:collapse}
.clth{width:var(--col-label);background:var(--surface);border-right:1px solid var(--border-s);position:sticky;left:0;z-index:11;padding:0 14px;height:var(--header-h);vertical-align:middle}
.cmth{width:var(--col-maint);background:var(--surface);border-right:1px solid var(--border-s);position:sticky;left:var(--col-label);z-index:11;padding:0 10px;height:var(--header-h);vertical-align:middle}
.cltd{background:var(--surface);border-right:1px solid var(--border-s);padding:7px 14px;position:sticky;left:0;z-index:9;border-bottom:1px solid var(--border);vertical-align:top}
.cmtd{background:var(--surface);border-right:1px solid var(--border-s);padding:7px 10px;position:sticky;left:var(--col-label);z-index:9;border-bottom:1px solid var(--border);vertical-align:top}
.dayth{width:var(--day-w);height:var(--header-h);text-align:center;padding-bottom:7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border-s);font-size:9px;color:var(--text3);background:var(--surface)}
.dayth .dn{display:block;font-size:12px;font-weight:600;color:var(--text2);font-family:'JetBrains Mono',monospace}
.dayth.tcol{background:var(--accent-mid)!important}
.dayth.wk{background:var(--surface2)}
.vrow{border-bottom:1px solid var(--border)}
.vname{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vplate{font-size:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.plate-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--c-booked);background:var(--cl-booked);border:1px solid rgba(30,64,175,.2);border-radius:4px;padding:1px 7px}
.vtelrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.vti{font-size:9px;color:var(--text3)}
.fbar-track{display:inline-block;width:32px;height:3px;background:var(--border-s);border-radius:2px;overflow:hidden;vertical-align:middle}
.fbar-fill{display:block;height:100%;border-radius:2px}
.maint-alert{display:flex;align-items:flex-start;gap:6px;background:linear-gradient(135deg,#fff1f0,#fee2e2);border:1px solid rgba(185,28,28,.2);border-radius:var(--radius-sm);padding:5px 8px;cursor:pointer}
.maint-alert-title{font-weight:700;color:var(--c-error);display:block}
.maint-ok{font-size:9px;color:var(--text3);display:flex;align-items:center;gap:4px}
.maint-last{font-size:9px;color:var(--text3);margin-top:3px;display:block}
.maint-register-btn{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--accent);background:var(--accent-mid);border:1px solid rgba(13,148,136,.25);border-radius:4px;padding:2px 7px;cursor:pointer;margin-top:4px}
.maint-hist-btn{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--text3);background:none;border:none;cursor:pointer;margin-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border-s);border-radius:var(--radius-lg);width:100%;max-width:390px;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 20px 13px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14px;font-weight:700}
.modal-sub{font-size:11px;color:var(--text2);margin-top:2px}
.modal-body{padding:15px 20px}
.form-row{margin-bottom:13px}
.form-label{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:4px}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border-s);border-radius:var(--radius-sm);padding:8px 11px;font-size:12px;color:var(--text);outline:none}
.modal-foot{padding:11px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border)}
.btn-cancel{font-size:12px;font-weight:500;color:var(--text2);background:var(--surface2);border:1px solid var(--border-s);border-radius:var(--radius-sm);padding:7px 16px;cursor:pointer}
.btn-save{font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:var(--radius-sm);padding:7px 16px;cursor:pointer}
.dcell{width:var(--day-w);height:var(--cell-h);border-right:1px solid var(--border);position:relative;vertical-align:middle;padding:0}
.dcell.wk{background:var(--surface2)}
.dcell.tcol{background:var(--accent-mid)}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:17px;display:flex;align-items:center;overflow:hidden;z-index:2;font-size:8px;font-weight:600;white-space:nowrap;padding:0 5px;cursor:pointer}
.bar.bs{border-radius:5px 0 0 5px;left:3px;right:0}
.bar.be{border-radius:0 5px 5px 0;left:0;right:3px}
.bar.bso{border-radius:5px;left:3px;right:3px}
.bar.bm{left:0;right:0;border-radius:0}
.bc{background:var(--cl-current);color:var(--c-current);border-left:2.5px solid var(--c-current)}
.bn{background:var(--cl-new);color:var(--c-new);border-left:2.5px solid var(--c-new)}
.bf{background:var(--cl-future);color:var(--c-future);border-left:2.5px solid var(--c-future)}
.bs2{background:var(--cl-service);color:var(--c-service);border-left:2.5px solid var(--c-service)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);align-items:center}
.li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.lsw{width:18px;height:4px;border-radius:2px}
.tip{position:fixed;background:var(--surface);color:var(--text);font-size:11px;padding:10px 13px;border-radius:var(--radius-sm);pointer-events:none;z-index:9999;display:none;border:1px solid var(--border-s);box-shadow:var(--shadow-lg)}
.empty{padding:56px;text-align:center;color:var(--text3)}
.map-pin-btn{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--c-booked);background:var(--cl-booked);border:1px solid rgba(96,165,250,.2);border-radius:4px;padding:1px 6px;cursor:pointer;margin-left:2px}
.map-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2500;display:none;align-items:center;justify-content:center;padding:16px}
.map-overlay.open{display:flex}
.map-modal{background:var(--surface);border:1px solid var(--border-s);border-radius:var(--radius-lg);width:100%;max-width:640px;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:90vh}
.map-head{padding:14px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.map-title{font-size:14px;font-weight:700}
.map-sub{font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace}
.map-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px}
#fleetMapContainer{height:400px;width:100%;flex:1}
.map-foot{padding:8px 18px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.map-coords{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.map-btn-osm{font-size:11px;color:var(--accent);background:var(--accent-l);border:1px solid var(--accent);border-radius:5px;padding:5px 10px;text-decoration:none}
.tmodal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.tmodal{background:var(--surface);border:1px solid var(--border-s);border-radius:14px;width:100%;max-width:660px;box-shadow:0 12px 40px rgba(0,0,0,.35);margin:auto}
.tmodal-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tmodal-title{font-size:14px;font-weight:700}
.tmodal-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tmodal-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px}
.tmodal-tabs{display:flex;border-bottom:1px solid var(--border)}
.tmodal-tab{flex:1;padding:10px 12px;font-size:11px;font-weight:600;background:none;border:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.tmodal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tmodal-body{padding:14px 16px 8px}
.tmodal-foot{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:4px}
.tire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:10px}
.tire-card{background:var(--surface2);border:1px solid var(--border-s);border-radius:8px;padding:10px 12px}
.tire-card-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tire-pos-badge{font-size:10px;font-weight:600;background:var(--c-booked);color:#fff;border-radius:4px;padding:2px 8px}
.tire-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.tire-field label{font-size:10px;font-weight:500;color:var(--text2);display:block;margin-bottom:3px}
.tire-field input,.tire-field select{width:100%;background:var(--surface);border:1px solid var(--border-s);border-radius:4px;padding:5px 7px;font-size:11px;color:var(--text);outline:none}
.add-tire-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-mid);border:1px dashed var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;margin-bottom:8px}
.acc-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}
.acc-table th{font-size:10px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border-s);padding:5px 8px;text-align:left}
.acc-table td{padding:4px 4px;border-bottom:1px solid var(--border)}
.acc-table td input,.acc-table td select{width:100%;background:var(--surface2);border:1px solid var(--border-s);border-radius:4px;padding:5px 7px;font-size:11px;color:var(--text)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo"><i class="ti ti-car"></i></div>
    <span class="brand-name">Fleet Calendar</span>
    <div class="brand-sep"></div>
    <span class="brand-sub">Retiro CERRITO CAR</span>
  </div>
  <div class="tr">
    <span class="datebadge" id="todayLbl"></span>
    <button class="filebtn" onclick="openTireModal(null,null)" style="color:var(--accent)">
      <i class="ti ti-tire" style="font-size:13px"></i> Neumáticos
    </button>
  </div>
</div>

<div class="stats">
  <div class="sc"><div class="sl">Flota total</div><div class="sv" id="stT">—</div><div class="ss">vehículos</div></div>
  <div class="sc"><div class="sl">En curso hoy</div><div class="sv" id="stC">—</div><div class="ss">reservas activas</div></div>
  <div class="sc"><div class="sl">Próximas</div><div class="sv" id="stN">—</div><div class="ss">reservas nuevas</div></div>
  <div class="sc"><div class="sl">Disponibles</div><div class="sv" id="stA">—</div><div class="ss">sin reserva</div></div>
  <div class="sc"><div class="sl">Alertas mant.</div><div class="sv" id="stM" style="color:#dc2626">—</div><div class="ss">próx. service</div></div>
</div>

<div class="main">
  <div id="app">
    <div class="empty"><i class="ti ti-files"></i><p>Cargando datos desde el servidor…</p></div>
  </div>
</div>

<div class="tip" id="tip"></div>

<!-- Modal registro mantenimiento -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Registrar mantenimiento</div>
      <div class="modal-sub" id="modalSub"></div>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">Tipo de servicio</label>
        <select class="form-input" id="maintType"><option value="">— Seleccioná el tipo de servicio —</option></select>
      </div>
      <div class="form-row">
        <label class="form-label">Intervalo (km del próximo service)</label>
        <select class="form-input" id="maintInterval"><option value="">— Se completa automáticamente —</option></select>
      </div>
      <div class="form-row">
        <label class="form-label">Fecha de realización</label>
        <input type="date" class="form-input" id="maintDate">
      </div>
      <div class="form-row">
        <label class="form-label">Observaciones (opcional)</label>
        <input type="text" class="form-input" id="maintNote" placeholder="ej: cambio de aceite...">
      </div>
      <div id="histSection">
        <div style="font-size:11px;font-weight:500;margin-bottom:4px;color:var(--text2)">Historial de mantenimientos</div>
        <div id="histList"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveMaint()">Guardar</button>
    </div>
  </div>
</div>

<script>
const MAINT_TYPES = [
  { label: 'Cambio de aceite y filtro', km: 10000 },
  { label: 'Rotación de neumáticos', km: 10000 },
  { label: 'Filtro de aire', km: 20000 },
  { label: 'Filtro de combustible', km: 20000 },
  { label: 'Bujías', km: 20000 },
  { label: 'Líquido de frenos', km: 30000 },
  { label: 'Correa / cadena de distribución', km: 40000 },
  { label: 'Amortiguadores', km: 50000 },
  { label: 'Revisión general (service mayor)', km: 0 },
  { label: 'Revisión de frenos', km: 0 },
  { label: 'Alineación y balanceo', km: 0 },
  { label: 'Otro (ver observaciones)', km: 0 },
];
const STORE_PREFIX = 'fleetcal_maint_';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
document.getElementById('todayLbl').textContent = TODAY.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'long',year:'numeric'});

let vYear = TODAY.getFullYear(), vMonth = TODAY.getMonth();
let ST = {pque:null, res:null, tel:null};
let modalPlate = null;

function esc(s){
  if(s==null) return '—';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getMaintHistory(plate) {
  if (!plate) return [];
  var p = plate.toUpperCase().trim();
  var localData = [];
  try {
    var raw = localStorage.getItem(STORE_PREFIX + p);
    localData = raw ? JSON.parse(raw) : [];
  } catch(e) { localData = []; }
  return localData; 
}

function getLastMaint(plate) {
  var h = getMaintHistory(plate);
  if (!h || !h.length) return null;
  return h.sort(function(a, b) { return b.date.localeCompare(a.date); })[0];
}

function maintAlertInfo(kmStr, plate){
  if(!kmStr || kmStr==='-') return null;
  const km = parseInt(kmStr.replace(/[.,]/g,''));
  if(isNaN(km)) return null;
  const nextMultiple = Math.ceil((km+1)/10000)*10000;
  const remaining = nextMultiple - km;
  if(remaining <= 2000){
    if(plate){
      const history = getMaintHistory(plate);
      const alreadyCleared = history.some(h => h.clearedMultiple === nextMultiple);
      if(alreadyCleared) return null;
    }
    return { km, nextMultiple, remaining };
  }
  return null;
}

window.openMaintModal = function(plate, modelName){
  modalPlate = plate;
  const tel = ST.tel ? ST.tel[plate] : null;
  const kmStr = tel ? tel.km : null;
  const alertInf = kmStr ? maintAlertInfo(kmStr, plate) : null;

  document.getElementById('modalTitle').textContent = 'Mantenimiento · ' + plate;
  document.getElementById('modalSub').textContent = modelName + (tel ? ' · ' + tel.km + ' km actuales' : '');
  document.getElementById('maintDate').value = TODAY.toISOString().slice(0,10);
  document.getElementById('maintNote').value = '';

  const typeEl = document.getElementById('maintType');
  typeEl.innerHTML = '<option value="">— Seleccioná el tipo de servicio —</option>';
  MAINT_TYPES.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = t.label;
    typeEl.appendChild(opt);
  });
  typeEl.value = '';
  typeEl.onchange = function() { updateIntervalSelect(alertInf); };
  updateIntervalSelect(alertInf);
  renderHistList(plate);
  document.getElementById('modalOverlay').style.display = 'flex';
};

function updateIntervalSelect(alertInf) {
  const typeIdx = document.getElementById('maintType').value;
  const intEl = document.getElementById('maintInterval');
  intEl.innerHTML = '';
  const nextMult = alertInf ? alertInf.nextMultiple : null;
  for(let k = 10000; k <= 200000; k += 10000) {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k.toLocaleString('es-AR') + ' km' + (k === nextMult ? ' ⚠️ próximo service' : '');
    intEl.appendChild(opt);
  }
  if(typeIdx !== '' && MAINT_TYPES[typeIdx] && MAINT_TYPES[typeIdx].km > 0) {
    intEl.value = MAINT_TYPES[typeIdx].km;
  } else if(nextMult) {
    intEl.value = nextMult;
  } else {
    intEl.value = 10000;
  }
}

window.closeModal = function(e){

};

window.saveMaint = function(){
  if(!modalPlate) return;
  const date = document.getElementById('maintDate').value;
  const note = document.getElementById('maintNote').value.trim();
  if(!date){ alert('Seleccioná una fecha'); return; }
  const typeIdx = document.getElementById('maintType').value;
  const typeLabel = typeIdx !== '' ? MAINT_TYPES[typeIdx].label : 'Servicio general';
  const intervalVal = parseInt(document.getElementById('maintInterval').value) || 10000;

  const tel = ST.tel ? ST.tel[modalPlate] : null;
  const clearedKmReal = tel && tel.km ? parseInt(tel.km, 10) : intervalVal;

  const nuevoItem = {
    date: date, tipo: typeLabel, type: typeLabel,
    intervalo: intervalVal, clearedMultiple: intervalVal,
    cleared_km: clearedKmReal, note: note, notes: note, ts: Date.now()
  };

  var p = modalPlate.toUpperCase().trim();
  var history = getMaintHistory(p);
  history.push(nuevoItem);
  try { localStorage.setItem(STORE_PREFIX + p, JSON.stringify(history)); } catch(e){}

  document.getElementById('maintNote').value = '';
  renderHistList(p);
  if(typeof renderCal === 'function') renderCal();
  alert('Mantenimiento registrado con éxito.');
};

window.deleteMaintEntry = function(plate, ts) {
  if(!plate) return;
  const p = plate.toUpperCase().trim();
  if(!confirm('¿Deseas eliminar este registro de mantenimiento?')) return;
  let history = getMaintHistory(p);
  history = history.filter(h => h.ts !== ts);
  try { localStorage.setItem(STORE_PREFIX + p, JSON.stringify(history)); } catch(e){}
  renderHistList(p);
  if(typeof renderCal === 'function') renderCal();
};

function renderHistList(plate) {
  if(!plate) return;
  var p = plate.toUpperCase().trim();
  var container = document.getElementById('histList');
  if(!container) return;
  var history = getMaintHistory(p);
  if(!history.length){
    container.innerHTML = '<div class="hist-empty">Sin registros previos.</div>';
    return;
  }
  container.innerHTML = history.map(h => `
    <div class="hist-item">
      <div>
        <span class="hist-date">${h.date} — ${h.tipo || h.type}</span>
        <div class="hist-note">${h.cleared_km || h.intervalo} km ${h.note || h.notes ? '· ' + (h.note || h.notes) : ''}</div>
      </div>
      <button class="hist-del" onclick="deleteMaintEntry('${p}', ${h.ts})">Eliminar</button>
    </div>
  `).join('');
}

// PARSERS
function parsePque(txt){
  return txt.trim().split('\n').filter(l=>l.trim()).map(line=>{
    const cols = line.split('\t');
    const main = cols[0].trim().split(/\s+/);
    const plate = main[main.length-1];
    const model = main.slice(1,-1).join(' ');
    const tankCap = cols[2] ? parseInt(cols[2].trim()) || 0 : 0;
    return {plate, model, tankCap};
  });
}
function parseRes(txt){
  return txt.trim().split('\n').filter(l=>l.trim()).map(line=>{
    const p=line.split('\t');
    if(p.length<7) return null;
    const [code,renter,vehicle,,,startS,endS,status]=p;
    const plate=vehicle.trim().split(' ').pop();
    return {code:code.trim(),renter:renter.trim(),vehicle:vehicle.trim(),plate,start:parseD(startS.trim()),end:parseD(endS.trim()),status:(status||'').trim()};
  }).filter(x=>x&&x.start&&x.end);
}
function parseTel(txt){
  const m={};
  txt.trim().split('\n').filter(l=>l.trim()).forEach(line=>{
    const p=line.split('\t');
    if(p.length<6) return;
    const plate=p[4].trim().split(' ').pop();
    m[plate]={id:p[0].trim(),coords:p[1].trim(),km:p[2].trim(),fuel:p[3].trim(),loc:p[5].trim()};
  });
  return m;
}
function parseD(str){
  const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const m=str.match(/(\d+):(\d+)\s+(AM|PM)\s+(\w+)\s+(\d+),\s+(\d+)/);
  if(!m) return null;
  let [,h,min,ap,mon,day,yr]=m;
  h=parseInt(h); if(ap==='PM'&&h!==12) h+=12; if(ap==='AM'&&h===12) h=0;
  return new Date(parseInt(yr),mo[mon],parseInt(day),h,parseInt(min));
}

// SINCRONIZACIÓN AUTOMÁTICA CDN
function sincronizarFlotaCDN() {
  const tokenBuster = Date.now();
  const cdnRaiz = "https://cdn.jsdelivr.net/gh/tencafre/Fleet_Manager/";

  fetch(cdnRaiz + "Pque.txt?v=" + tokenBuster)
    .then(r => r.text()).then(t => { ST.pque = parsePque(t); tryRender(); }).catch(e => console.warn(e));
  
  fetch("https://raw.githubusercontent.com/tencafre/Fleet_Manager/main/scraped_data.txt?v=" + tokenBuster)
    .then(r => r.text()).then(t => { ST.res = parseRes(t); tryRender(); }).catch(e => console.warn(e));
  
  fetch("https://raw.githubusercontent.com/tencafre/Fleet_Manager/main/TelemGts_data.txt?v=" + tokenBuster)
    .then(r => r.text()).then(t => { ST.tel = parseTel(t); tryRender(); }).catch(e => console.warn(e));
}

function updateStats(){
  document.getElementById('stT').textContent = ST.pque.length;
  document.getElementById('stC').textContent = ST.res.filter(r=>r.start<=TODAY&&r.end>=TODAY).length;
  document.getElementById('stN').textContent = ST.res.filter(r=>r.status==='New').length;
  const activePlates = new Set(ST.res.filter(r=>r.start<=TODAY&&r.end>=TODAY).map(r=>r.plate));
  document.getElementById('stA').textContent = ST.pque.filter(v=>!activePlates.has(v.plate)).length;
  let maintAlerts = 0;
  ST.pque.forEach(v=>{
    const tel = ST.tel[v.plate];
    if(tel && maintAlertInfo(tel.km, v.plate)) maintAlerts++;
  });
  document.getElementById('stM').textContent = maintAlerts;
}

function renderCal(){
  const y=vYear, mo=vMonth;
  const days=new Date(y,mo+1,0).getDate();
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DOW=['D','L','M','X','J','V','S'];
  const toD=d=>new Date(y,mo,d);

  let html=`<div class="mnav">
    <button class="nbtn" onclick="shiftMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <span class="mtitle">${MONTHS[mo]} ${y}</span>
    <button class="nbtn" onclick="shiftMonth(1)"><i class="ti ti-chevron-right"></i></button>
    <button class="nbtn tbtn" onclick="goToday()">hoy</button>
  </div>`;

  html+=`<div class="calwrap"><div class="calscroll"><table class="caltable"><thead><tr>`;
  html+=`<th class="clth" style="font-size:10px;color:var(--text2)">VEHÍCULO</th>`;
  html+=`<th class="cmth" style="font-size:10px;color:var(--text2)">MANTENIMIENTO</th>`;
  for(let d=1;d<=days;d++){
    const dt=toD(d); const dow=dt.getDay();
    const isToday=dt.toDateString()===TODAY.toDateString();
    html+=`<th class="dayth${dow===0||dow===6?' wk':''}${isToday?' tcol':''}"><span class="dn">${d}</span>${DOW[dow]}</th>`;
  }
  html+=`</tr></thead><tbody>`;

  ST.pque.forEach(veh=>{
    const vRes=ST.res.filter(r=>r.plate===veh.plate);
    const tel=ST.tel[veh.plate];
    const alert=tel?maintAlertInfo(tel.km,veh.plate):null;
    const lastMaint=getLastMaint(veh.plate);
    const histCount=getMaintHistory(veh.plate).length;

    html+=`<tr class="vrow">`;
    html+=`<td class="cltd">
      <span class="vname" title="${veh.model}">${veh.model}</span>
      <span class="vplate">
        <span class="plate-tag">${veh.plate}</span>
        ${tel?`<span style="color:var(--accent)">${tel.loc}</span>`:''}
        ${tel&&tel.coords&&tel.coords!=='-'?`<button class="map-pin-btn" onclick="openVehMap('${veh.plate}')">mapa</button>`:''}
      </span>
      ${tel?`<span class="vtelrow"><span class="vti">${tel.km} km · ⛽ ${tel.fuel}L</span></span>`:''}
    </td>`;

    html+=`<td class="cmtd">
      ${alert?`<div class="maint-alert" onclick="openMaintModal('${veh.plate}','${veh.model.replace(/'/g,"\\'")}')"><span class="maint-alert-title">Service próximo</span></div>`:
      `<span class="maint-ok"><i class="ti ti-circle-check"></i> Al día</span>`}
      ${lastMaint?`<span class="maint-last">Último: ${lastMaint.date}</span>`:''}
      <button class="maint-register-btn" onclick="openMaintModal('${veh.plate}','${veh.model.replace(/'/g,"\\'")}')"><i class="ti ti-plus"></i> Registrar</button>
      ${histCount>0?`<button class="maint-hist-btn" onclick="openMaintModal('${veh.plate}','${veh.model.replace(/'/g,"\\'")}')">${histCount} reg.</button>`:''}
    </td>`;

    for(let d=1;d<=days;d++){
      const dt=toD(d); const dow=dt.getDay();
      const isToday=dt.toDateString()===TODAY.toDateString();
      html+=`<td class="dcell${dow===0||dow===6?' wk':''}${isToday?' tcol':''}">`;
      vRes.forEach(res=>{
        const dd=new Date(y,mo,d); dd.setHours(0,0,0,0);
        const s=new Date(res.start); s.setHours(0,0,0,0);
        const e=new Date(res.end); e.setHours(0,0,0,0);
        if(dd>=s && dd<=e){
          const iS=dd.getTime()===s.getTime(), iE=dd.getTime()===e.getTime();
          const btype = (iS&&iE)?'bso':iS?'bs':iE?'be':'bm';
          const bc = res.status==='Current'?'bc':'bn';
          const tipData=JSON.stringify({code:res.code,renter:res.renter,start:res.start.toLocaleDateString(),end:res.end.toLocaleDateString(),plate:res.plate}).replace(/"/g,'&quot;');
          html+=`<div class="bar ${btype} ${bc}" data-checklist="${tipData}" onclick="openChecklist(this)">${iS?res.renter:''}</div>`;
        }
      });
      html+=`</td>`;
    }
    html+=`</tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('app').innerHTML=html;
}

window.openVehMap = function(plate){
  const tel = ST.tel[plate];
  if(!tel || !tel.coords) return;
  const parts = tel.coords.split(',').map(s => parseFloat(s.trim()));
  document.getElementById('mapTitle').textContent = 'Ubicación · ' + plate;
  document.getElementById('mapSub').textContent = tel.km + ' km · ' + tel.loc;
  document.getElementById('mapCoords').textContent = tel.coords;
  document.getElementById('mapOsmLink').href = 'https://www.openstreetmap.org/?mlat=' + parts[0] + '&mlon=' + parts[1] + '&zoom=15';
  document.getElementById('mapOverlay').classList.add('open');
  setTimeout(()=>{
    if(!window._leafletMap){
      window._leafletMap = L.map('fleetMapContainer').setView(parts, 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(window._leafletMap);
    } else {
      window._leafletMap.setView(parts, 15);
      window._leafletMap.invalidateSize();
    }
    L.marker(parts).addTo(window._leafletMap);
  }, 100);
};

window.closeMapModal = function(e){
  if(e && e.target!==document.getElementById('mapOverlay')) return;
  document.getElementById('mapOverlay').classList.remove('open');
};
